# Smoke configuration: proves the pipeline works end to end in seconds,
# on a small slice of the real corpus, before committing to the full run.
#
# Only scale differs from default.yaml. Every fidelity-critical setting
# (byte_fallback, identity normalization, add_dummy_prefix, split_digits...)
# is IDENTICAL, because those are exactly the settings the smoke test needs
# to exercise -- a smoke run with different fidelity settings would prove
# nothing about the real run.

corpus:
  input_sentence_size: 50000
  max_sentence_length: 8192
  max_drop_fraction: 0.01

sampling:
  seed: 42

blend:
  # How the sample is distributed across corpus sources (DESIGN.md 4.3).
  #
  #   weighted -- each source contributes the BYTE share below. Required for
  #               a correct blend: average line length varies ~6x between
  #               sources (PG-19 books are newline-wrapped at ~69 bytes/line,
  #               C4 documents average ~447), so drawing lines uniformly
  #               would hand the tokenizer ~55% Gutenberg and ~8% C4 instead
  #               of 20%/20% -- fitting the vocabulary to the wrong corpus
  #               mix (risk R4) while every download share looked correct.
  #   uniform  -- draw lines uniformly, ignore shares. For ad-hoc corpora.
  #
  # Source names come from corpus filenames: fineweb_edu_7000mb.jsonl ->
  # fineweb_edu. Shares are renormalized over the sources actually present,
  # so a partial corpus still produces a correctly proportioned sample.
  mode: weighted
  shares:
    fineweb_edu: 0.35
    c4: 0.20
    stackexchange: 0.15
    cosmopedia: 0.10
    gutenberg_pg19: 0.20

trainer:
  model_type: unigram
  # Small enough to fit the pieces a tiny corpus can support, while still
  # exceeding the 632-slot reserved block (373 user-defined + 3 control +
  # 256 byte-fallback).
  vocab_size: 2048

  byte_fallback: true
  character_coverage: 1.0
  normalization_rule_name: identity
  remove_extra_whitespaces: false
  allow_whitespace_only_pieces: true
  add_dummy_prefix: false
  split_digits: true

  train_extremely_large_corpus: false
  num_threads: 0

  pad_id: 0
  eos_id: 1
  unk_id: 2
  bos_id: -1

output:
  dir: output_smoke
  model_prefix: spm

validation:
  run_after_training: true
  eval_sentence_size: 0
  eval_sample_save: 1000
  length_reservoir_size: 5000
  rare_token_max_count: 5
  # A 2048-piece vocabulary is necessarily less efficient than the real
  # 32832 one, so the efficiency bands are widened: on a smoke run these
  # metrics are informational, and only the hard fidelity gates carry
  # meaning. Utilization in particular is meaningless at smoke scale --
  # gate 10 detects that on its own and reports it as informational.
  fertility_target_min: 1.0
  fertility_target_max: 3.0
  fertility_code_warn_above: 5.0
  byte_fallback_rate_warn_above: 0.05
  chars_per_token_warn_below: 1.0
  vocab_utilization_warn_below: 0.10
