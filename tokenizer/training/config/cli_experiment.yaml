# Blend config for the CLI-helper vocabulary sweep (run_cli_vocab_experiment.py).
#
# Every setting outside `blend` is identical to config/default.yaml -- this
# file only exists because the *corpus mix* changed (pretrain_corpus/'s 12
# sources replace the older 5-source training_corpus/ download), not because
# any fidelity-critical trainer setting needed to change.
#
# Composition, and why it looks like this
# ----------------------------------------
# Three sources (cli_tldr, cli_nl2bash, cli_cheat_sheets) are genuinely small
# enough, in eligible-LINE terms (corpus_reader.py counts one eligible line
# per newline-separated segment of a record -- the unit SentencePiece trains
# on, not the record itself), to reliably force full inclusion at every
# tested input_sentence_size: their true capacities, measured against the
# real corpus, are 71,835 / 24,810 / 4,130 lines respectively. cli_tldr's
# share is 0.13, not 0.10 like its two siblings, because at the smallest
# tested size (250,000) 0.10 fell 5,773 lines short (measured: 66,062/71,835)
# -- its capacity is close enough to that budget that the smaller shares
# just weren't quite sufficient headroom; 0.13 clears it with margin.
# run_cli_vocab_experiment.py's FORCED_SOURCES verifies this against the real
# corpus before launching the sweep rather than assuming these numbers hold.
#
# cli_man_pages is NOT forced, despite looking like the same case. Its text
# is troff-formatted and splits into ~29 eligible lines per record on
# average (measured: 492,863 eligible lines from 16,910 records) -- bigger
# than this sweep's own smallest tested size. No share can force "100%
# included" there (that would need more than the entire budget devoted to
# just this source, confirmed empirically up to share=0.50). It takes an
# ordinary weighted share instead, same as cli_helper_stack_exchange, and
# gets whatever proportional inclusion its weight earns at each size --
# substantial even at 250,000 (measured: 42,537 lines, 8.6% of its content)
# and complete from 2,000,000 upward.
#
# cli_helper_stack_exchange (a Stack Exchange dump already filtered to
# sysadmin/CLI-relevant sites -- askubuntu, unix, superuser, serverfault,
# etc.) is real volume (~4.9M records post-dedup against the general
# stackexchange source) and gets an ordinary weighted share like the other
# eight, boosted somewhat above what a purely general-purpose blend would
# give it, since improving CLI vocabulary coverage is this sweep's actual
# purpose.
#
# The non-CLI shares keep the same relative proportions to each other as
# pretrain_corpus/download.py's DEFAULT_BLEND, with cli_helper_stack_exchange
# up-weighted relative to general stackexchange; fineweb_edu absorbs the 0.03
# moved to cli_tldr above, so the total still sums to 1.0.

corpus:
  input_sentence_size: 1000000 # always overridden per variant by --input-sentence-size
  max_sentence_length: 8192
  max_drop_fraction: 0.01

sampling:
  seed: 42

blend:
  mode: weighted
  shares:
    fineweb_edu: 0.222
    c4: 0.084
    cosmopedia: 0.045
    gutenberg_pg19: 0.066
    slimpajama: 0.066
    stackexchange: 0.027
    permissive_code: 0.018
    cli_helper_stack_exchange: 0.042
    cli_tldr: 0.13
    cli_nl2bash: 0.10
    cli_man_pages: 0.10
    cli_cheat_sheets: 0.10

trainer:
  model_type: unigram
  vocab_size: 32832

  # -- fidelity-critical (NF1), do not change casually --
  byte_fallback: true
  character_coverage: 1.0
  normalization_rule_name: identity
  remove_extra_whitespaces: false
  allow_whitespace_only_pieces: true
  add_dummy_prefix: false
  split_digits: true

  # -- scale / memory --
  train_extremely_large_corpus: true
  # Always overridden per variant by run_cli_vocab_experiment.py, sized to
  # (cpu cores) / (parallel variants) so N concurrent trainings share the
  # machine instead of each grabbing every core.
  num_threads: 0

  # -- ids --
  pad_id: 0
  eos_id: 1
  unk_id: 2
  bos_id: -1

output:
  dir: output
  model_prefix: spm

validation:
  run_after_training: true
  eval_sentence_size: 0 # always overridden per variant by --eval-corpus
  eval_sample_save: 20000
  length_reservoir_size: 200000
  rare_token_max_count: 10
  fertility_target_min: 1.25
  fertility_target_max: 1.40
  fertility_code_warn_above: 2.5
  byte_fallback_rate_warn_above: 0.005
  chars_per_token_warn_below: 3.0
  vocab_utilization_warn_below: 0.90
