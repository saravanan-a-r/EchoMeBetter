[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: trains a real SentencePiece model (integration/smoke)
filterwarnings =
    error::DeprecationWarning:corpus_reader
    error::DeprecationWarning:config_loader
    error::DeprecationWarning:trainer
    error::DeprecationWarning:validate_tokenizer
