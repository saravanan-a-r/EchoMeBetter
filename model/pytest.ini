[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: allocates a full-size (223M+) model
    ul2: requires the UL2 module alongside this one
    real_tokenizer: requires the trained tokenizer artifacts
    huggingface: requires the transformers library
