[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    real_tokenizer: needs the trained tokenizer artifacts under tokenizer/training/output
    real_data: needs the rephrase dataset under REPHRASE_MODEL/rephrase_dataset/final/concise
    slow: builds the full-size (752M) model
